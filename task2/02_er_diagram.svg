<svg width="680" height="504" viewBox="0 0 680 504" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<title>Entity relationship diagram</title>
<desc>Student table connects one-to-many to Skill Assessment and one-to-many to Project Idea.</desc>
<rect x="0" y="0" width="680" height="504" fill="#FFFFFF"/>
<defs>
<marker id="arrowb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="340" y1="228" x2="160" y2="300" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrowb)"/>
<text x="300" y="255" font-size="11" fill="#5F5E5A">1</text>
<text x="195" y="290" font-size="11" fill="#5F5E5A">N</text>

<line x1="340" y1="228" x2="500" y2="300" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrowb)"/>
<text x="375" y="255" font-size="11" fill="#5F5E5A">1</text>
<text x="465" y="290" font-size="11" fill="#5F5E5A">N</text>

<!-- STUDENT -->
<rect x="230" y="30" width="220" height="30" fill="#AFA9EC" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#26215C">STUDENT</text>
<rect x="230" y="60" width="220" height="168" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<g font-size="12" fill="#26215C">
<text x="240" y="76">PK student_id</text><text x="440" y="76" text-anchor="end">uuid</text>
<line x1="230" y1="84" x2="450" y2="84" stroke="#CECBF6" stroke-width="1"/>
<text x="240" y="100">name</text><text x="440" y="100" text-anchor="end">string</text>
<line x1="230" y1="108" x2="450" y2="108" stroke="#CECBF6" stroke-width="1"/>
<text x="240" y="124">email</text><text x="440" y="124" text-anchor="end">string</text>
<line x1="230" y1="132" x2="450" y2="132" stroke="#CECBF6" stroke-width="1"/>
<text x="240" y="148">password_hash</text><text x="440" y="148" text-anchor="end">string</text>
<line x1="230" y1="156" x2="450" y2="156" stroke="#CECBF6" stroke-width="1"/>
<text x="240" y="172">branch</text><text x="440" y="172" text-anchor="end">string</text>
<line x1="230" y1="180" x2="450" y2="180" stroke="#CECBF6" stroke-width="1"/>
<text x="240" y="196">year</text><text x="440" y="196" text-anchor="end">int</text>
<line x1="230" y1="204" x2="450" y2="204" stroke="#CECBF6" stroke-width="1"/>
<text x="240" y="220">created_at</text><text x="440" y="220" text-anchor="end">timestamp</text>
</g>

<!-- SKILL_ASSESSMENT -->
<rect x="40" y="300" width="240" height="30" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="160" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#04342C">SKILL_ASSESSMENT</text>
<rect x="40" y="330" width="240" height="120" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<g font-size="12" fill="#04342C">
<text x="50" y="346">PK assessment_id</text><text x="270" y="346" text-anchor="end">uuid</text>
<line x1="40" y1="354" x2="280" y2="354" stroke="#9FE1CB" stroke-width="1"/>
<text x="50" y="370">FK student_id</text><text x="270" y="370" text-anchor="end">uuid</text>
<line x1="40" y1="378" x2="280" y2="378" stroke="#9FE1CB" stroke-width="1"/>
<text x="50" y="394">tech_stack</text><text x="270" y="394" text-anchor="end">string</text>
<line x1="40" y1="402" x2="280" y2="402" stroke="#9FE1CB" stroke-width="1"/>
<text x="50" y="418">proficiency_level</text><text x="270" y="418" text-anchor="end">string</text>
<line x1="40" y1="426" x2="280" y2="426" stroke="#9FE1CB" stroke-width="1"/>
<text x="50" y="442">submitted_at</text><text x="270" y="442" text-anchor="end">timestamp</text>
</g>

<!-- PROJECT_IDEA -->
<rect x="380" y="300" width="240" height="30" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="500" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#04342C">PROJECT_IDEA</text>
<rect x="380" y="330" width="240" height="144" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<g font-size="12" fill="#04342C">
<text x="390" y="346">PK idea_id</text><text x="610" y="346" text-anchor="end">uuid</text>
<line x1="380" y1="354" x2="620" y2="354" stroke="#9FE1CB" stroke-width="1"/>
<text x="390" y="370">FK student_id</text><text x="610" y="370" text-anchor="end">uuid</text>
<line x1="380" y1="378" x2="620" y2="378" stroke="#9FE1CB" stroke-width="1"/>
<text x="390" y="394">title</text><text x="610" y="394" text-anchor="end">string</text>
<line x1="380" y1="402" x2="620" y2="402" stroke="#9FE1CB" stroke-width="1"/>
<text x="390" y="418">description</text><text x="610" y="418" text-anchor="end">string</text>
<line x1="380" y1="426" x2="620" y2="426" stroke="#9FE1CB" stroke-width="1"/>
<text x="390" y="442">status</text><text x="610" y="442" text-anchor="end">string</text>
<line x1="380" y1="450" x2="620" y2="450" stroke="#9FE1CB" stroke-width="1"/>
<text x="390" y="466">submitted_at</text><text x="610" y="466" text-anchor="end">timestamp</text>
</g>
</svg>
