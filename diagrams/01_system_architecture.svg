<svg width="680" height="518" viewBox="0 0 680 518" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<title>Milestone 1 system architecture</title>
<desc>Student client and faculty client both connect to an API layer, which connects to a future agent orchestration layer placeholder, which connects to a PostgreSQL database.</desc>
<rect x="0" y="0" width="680" height="518" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="220" y1="96" x2="325" y2="190" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460" y1="96" x2="355" y2="190" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="246" x2="340" y2="306" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="362" x2="340" y2="422" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="120" y="40" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="220" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Student client</text>
<text x="220" y="82" text-anchor="middle" font-size="12" fill="#444441">Web/app UI</text>

<rect x="360" y="40" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="460" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Faculty client</text>
<text x="460" y="82" text-anchor="middle" font-size="12" fill="#444441">Dashboard UI</text>

<rect x="210" y="190" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#26215C">API layer</text>
<text x="340" y="232" text-anchor="middle" font-size="12" fill="#3C3489">REST endpoints + auth</text>

<rect x="180" y="306" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="340" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Agent orchestration layer</text>
<text x="340" y="348" text-anchor="middle" font-size="12" fill="#444441">Future — Milestone 2 onward</text>

<rect x="210" y="422" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="444" text-anchor="middle" font-size="14" font-weight="bold" fill="#04342C">PostgreSQL database</text>
<text x="340" y="464" text-anchor="middle" font-size="12" fill="#085041">Students, assessments, ideas</text>
</svg>
